name: Lint, test and build
on: [push]
jobs:
    linting-and-prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - name: Installing dependencies
              run: pnpm install --frozen-lockfile
            - run: pnpm run tsc
            - run: pnpm run lint
            - run: pnpm run prettier

    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - name: Installing dependencies
              run: pnpm install --frozen-lockfile
            - run: pnpm run test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - name: Installing dependencies
              run: pnpm install --frozen-lockfile
            - run: pnpm run build
