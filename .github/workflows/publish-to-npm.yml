name: Publish to NPM
on:
    workflow_dispatch:
    push:
        branches:
            - 'main'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    id-token: write # Required for OIDC
    contents: write
    pull-requests: write
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'

            - name: Update npm
              run: npm install -g npm@latest && npm --version

            - name: Installing dependencies
              run: npm ci && pwd

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@e0538e686673de0265c8a3e2904b8c76beaa43fd
              with:
                  publish: npm run packages:publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate dispatch token
              if: steps.changesets.outputs.published == 'true'
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.UI_NPM_UPDATE_APP_ID }}
                  private-key: ${{ secrets.UI_NPM_UPDATE_APP_PRIVATE_KEY }}
                  owner: workfloworchestrator
                  repositories: example-orchestrator-ui

            - name: Trigger package update in example-orchestrator-ui
              if: steps.changesets.outputs.published == 'true'
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  repository: workfloworchestrator/example-orchestrator-ui
                  event-type: update-orchestrator-npm-packages
